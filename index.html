<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="icon.ico">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&family=Titillium+Web:wght@400;600&display=swap"
        rel="stylesheet">
    <title>BountyRadar</title>
</head>

<body>
    <header>
        <nav>
            <div class="logo">
                <img src="logo.png" alt="">
            </div>
            <ul class="nav-links">
                <li><a href="#feed">feed</a></li>
                <li><a href="#owasp">OWASP 10</a></li>
                <li><a href="#disclosures">Disclosures</a></li>
                <li><a href="#leaderboard">rankings</a></li>
            </ul>
            <div class="nav-list"><i class="fa-solid fa-bars"></i></div>
        </nav>
    </header>
    <main>
        <section id="feed">
            <h2>Radar</h2>
            <div class="card-container"></div>
        </section>
        <section id="owasp">
            <h2>OWASP top 10</h2>
            <div class="owasp-container"></div>
        </section>
        <section id="disclosures">
            <h2>latest disclosures</h2>
            <div class="filters">
                <div class="search-container">
                    <input type="text" id="search" placeholder="search">
                    <button class="search">search</button>
                </div>
                <div class="vulns-list"></div>

            </div>
        </section>

        <section id="leaderboard">
            <h2>global ranking</h2>
            <table>
                <thead>
                    <th>rank</th>
                    <th>team name</th>
                    <th>points</th>
                    <th>team id</th>
                </thead>
                <tbody id="hackers-list"></tbody>
            </table>
        </section>
    </main>
    <footer>
        <div class="copyright">
            copyright &copy; Abdelrahman Ashour 2026
        </div>
    </footer>
    <script src="script.js"></script>
</body>

</html>
